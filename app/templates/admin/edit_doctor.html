{% extends "base.html" %}
{% block title %}تعديل بيانات الطبيب — نظام الشفاء للرعاية الصحية{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="fw-bold mb-1">✏️ تعديل بيانات الطبيب وساعات العمل</h2>
        <span class="text-muted">د. {{ doctor.user.full_name }}</span>
    </div>
    <a href="{{ url_for('admin.doctors') }}" class="btn btn-outline-secondary">
        &larr; العودة للقائمة
    </a>
</div>
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="card shadow-sm border">
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.edit_doctor', doctor_id=doctor.id) }}" novalidate>
                    <h5 class="text-primary fw-bold mb-3">👤 بيانات الحساب</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">الاسم الأول *</label>
                            <input type="text" class="form-control" name="first_name" value="{{ doctor.user.first_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">اسم العائلة *</label>
                            <input type="text" class="form-control" name="last_name" value="{{ doctor.user.last_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">البريد الإلكتروني *</label>
                            <input type="email" class="form-control" name="email" value="{{ doctor.user.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">رقم الهاتف</label>
                            <input type="tel" class="form-control" name="phone" value="{{ doctor.user.phone or '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">كلمة المرور الجديدة <small class="text-muted">(اتركها فارغة للإبقاء على الحالية)</small></label>
                            <input type="password" class="form-control" name="new_password">
                        </div>
                    </div>
                    <hr>
                    <h5 class="text-success fw-bold mb-3">🏅 البيانات المهنية وساعات الدوام</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">التخصص *</label>
                            <select class="form-select" name="specialty" required>
                                {% for spec in ['General Medicine','Cardiology','Dermatology','Neurology','Orthopedics','Pediatrics','Psychiatry','Surgery','Ophthalmology','ENT'] %}
                                <option value="{{ spec }}" {% if doctor.specialty == spec %}selected{% endif %}>{{ spec }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">سنوات الخبرة</label>
                            <input type="number" class="form-control" name="experience_years" value="{{ doctor.experience_years }}" min="0">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">بداية الدوام اليومي *</label>
                            <input type="time" class="form-control" name="working_start_time" value="{{ doctor.working_start_time.strftime('%H:%M') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">نهاية الدوام اليومي *</label>
                            <input type="time" class="form-control" name="working_end_time" value="{{ doctor.working_end_time.strftime('%H:%M') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">سعر الكشف (ر.س)</label>
                            <input type="number" class="form-control" name="consultation_fee" value="{{ doctor.consultation_fee }}" step="0.01">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">حالة التوفر للحجز</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" name="is_available" id="is_available" {% if doctor.is_available %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="is_available">متاح لاستقبال المواعيد والحجوزات</label>
                            </div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">نبذة وسيرة ذاتية</label>
                            <textarea class="form-control" name="bio" rows="3">{{ doctor.bio or '' }}</textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                            💾 حفظ التعديلات
                        </button>
                        <a href="{{ url_for('admin.doctors') }}" class="btn btn-outline-secondary px-4 py-2">
                            إلغاء
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
